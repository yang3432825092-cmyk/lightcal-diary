<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF6EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="轻卡日记">
<meta name="application-name" content="轻卡日记">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>轻卡日记 · 减脂记录</title>
<style>
:root{
  --bg:#FAF6EF;
  --card:#FFFFFF;
  --ink:#2A2621;
  --sub:#6F675C;
  --line:#EDE5D8;
  --green:#437A5B;
  --green-chart:#5C9A78;
  --green-soft:#E8F2EA;
  --orange:#A85F26;
  --orange-soft:#FBEDE0;
  --red:#B05A4C;
  --blue:#7C9AA8;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#EFE9DF;color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.app{
  max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);
  position:relative;padding-bottom:96px;
  box-shadow:0 0 40px rgba(60,45,30,.06);
}
/* 独立窗口（装到主屏幕）时，为状态栏／灵动岛留出高度 */
.standalone .page{padding-top:calc(8px + env(safe-area-inset-top))}
.page{padding:8px 18px 12px}
.view{animation:none}

/* 顶栏 */
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 0 10px}
.hdr h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.2px}
.hdr .sub{margin:2px 0 0;font-size:12.5px;color:var(--sub)}
.hdr .date{font-size:12.5px;color:var(--sub);padding-top:6px}
.back{
  display:flex;align-items:center;gap:6px;color:var(--sub);font-size:13px;
  padding:16px 0 6px;
}
.back svg{width:16px;height:16px}

/* 卡片 */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;margin-bottom:14px;
}
.card.tight{padding:14px 16px}
.card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title h2{margin:0;font-size:14px;font-weight:600}
.card-title .sub{font-size:12px;color:var(--sub)}

/* 首页体重 */
.hero{padding:22px 20px 18px;position:relative}
.eyebrow{font-size:12px;color:var(--sub);letter-spacing:1.5px}
.big-weight{
  display:flex;align-items:baseline;gap:8px;margin:6px 0 2px;
  font-variant-numeric:tabular-nums;
}
.big-weight .num{
  font-size:66px;line-height:1.05;font-weight:600;letter-spacing:-2.5px;
}
.big-weight .num.placeholder{color:#D8CFC2;letter-spacing:2px;font-size:52px}
.big-weight .unit{font-size:17px;color:var(--sub);font-weight:500}
.hero .record-date{font-size:12.5px;color:var(--sub)}
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  height:46px;border-radius:14px;font-size:15px;font-weight:500;
  background:var(--green);color:#fff;width:100%;
}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.small{height:36px;font-size:13px;border-radius:11px;width:auto;padding:0 14px}
.btn.orange{background:var(--orange)}
.hero .btn{margin-top:16px}
.btn:active{opacity:.85}

/* 体重统计 */
.stats{display:flex;gap:8px;margin-bottom:14px}
.stat{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 12px 11px;
}
.stat .k{font-size:11.5px;color:var(--sub);white-space:nowrap}
.stat .v{font-size:19px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.stat .v small{font-size:11px;font-weight:400;color:var(--sub);margin-left:2px}
.down{color:var(--green)}
.up{color:var(--orange)}
.flat{color:var(--sub)}

/* 区间切换 */
.seg{display:flex;gap:4px;background:#F4EEE4;border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{
  flex:1;height:30px;border-radius:9px;font-size:12.5px;color:var(--sub);
}
.seg button.on{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(60,45,30,.06)}

/* 图表 */
.chart-wrap{position:relative}
.chart{width:100%;display:block;overflow:visible}
.chart text{font-size:9px;fill:var(--sub);font-family:inherit}
.chart .dot{fill:#fff;stroke:var(--green-chart);stroke-width:2;cursor:pointer}
.chart .dot.on{fill:var(--green)}
.chart .avg{stroke:#D9C7AE;stroke-width:1.4;stroke-dasharray:4 4;fill:none}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:5px;border-radius:2px}
.legend .l1{background:var(--green-chart)}
.legend .l2{background:#D9C7AE}

/* 目标进度 */
.target-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.target-row .big{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.target-row .sub{font-size:12px;color:var(--sub)}
.bar{height:8px;border-radius:6px;background:#F1EAE0;overflow:hidden}
.bar span{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .3s}
.progress-note{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-top:7px}

/* 列表行 */
.row{
  display:flex;align-items:center;gap:12px;padding:13px 0;
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:none}
.row .ico{
  width:36px;height:36px;border-radius:11px;background:var(--green-soft);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;
}
.row .ico.o{background:var(--orange-soft)}
.row .main{flex:1;min-width:0}
.row .t{font-size:14.5px}
.row .d{font-size:11.5px;color:var(--sub);margin-top:1px}
.row .arrow{color:#9C9184;font-size:15px}
.row .val{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}

/* 低卡首页三卡 */
.sec-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;margin-bottom:13px;display:flex;align-items:center;gap:14px;
}
.sec-card .emoji{
  width:52px;height:52px;border-radius:16px;display:flex;align-items:center;
  justify-content:center;font-size:24px;flex:none;background:var(--green-soft);
}
.sec-card.snack .emoji{background:var(--orange-soft)}
.sec-card.takeout .emoji{background:#EAF0F2}
.sec-card .m{flex:1}
.sec-card h3{margin:0;font-size:16px;font-weight:600}
.sec-card p{margin:3px 0 0;font-size:12px;color:var(--sub);line-height:1.5}
.sec-card .count{font-size:11.5px;color:var(--sub);margin-top:6px}

/* 搜索 */
.search{position:relative;margin-bottom:12px}
.search input{
  width:100%;height:42px;border-radius:12px;border:1px solid var(--line);
  background:#fff;padding:0 14px 0 38px;outline:none;font-size:14px;
}
.search input::placeholder{color:#BDB3A5}
.search svg{position:absolute;left:13px;top:12px;width:17px;height:17px;stroke:#BDB3A5}

/* 标签 */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;height:31px;padding:0 13px;border-radius:16px;border:1px solid var(--line);
  background:#fff;font-size:12.5px;color:var(--sub);white-space:nowrap;
}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip.orange.on{background:var(--orange);border-color:var(--orange)}
.wrap-chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 8px}

/* 食品卡 */
.food{
  display:flex;gap:12px;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:12px;margin-bottom:10px;
}
.food .thumb{
  width:62px;height:62px;border-radius:14px;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:28px;background:#F6F1E8;
}
.food .info{flex:1;min-width:0}
.food .name{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.food .name .fav{color:var(--orange);font-size:13px}
.food .meta{font-size:11.5px;color:var(--sub);margin-top:3px}
.food .macros{display:flex;gap:10px;font-size:11px;color:var(--sub);margin-top:6px;font-variant-numeric:tabular-nums}
.food .macros b{color:var(--ink);font-weight:500}
.food .right{flex:none;text-align:right;display:flex;flex-direction:column;justify-content:space-between}
.kcal{font-size:15px;font-weight:600;color:var(--orange);font-variant-numeric:tabular-nums}
.kcal small{font-size:10px;font-weight:400;color:var(--sub);margin-left:1px}
.tag-sample{
  display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;
  background:#F4EEE4;color:#6E6455;margin-left:4px;vertical-align:1px;
}
.fav-btn{font-size:16px;color:#8C8071;line-height:1}
.fav-btn.on{color:var(--orange)}

/* 空状态 */
.empty{text-align:center;padding:34px 10px;color:var(--sub);font-size:13px}
.empty .e{font-size:30px;display:block;margin-bottom:8px;opacity:.7}

/* 饮食记录 */
.date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.date-nav button{
  width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid var(--line);
  color:var(--sub);font-size:15px;display:flex;align-items:center;justify-content:center;
}
.date-nav .d{text-align:center}
.date-nav .d b{font-size:15px;font-weight:600;display:block}
.date-nav .d span{font-size:11.5px;color:var(--sub)}
.totals{display:flex;gap:6px;text-align:center;margin:14px 0 4px}
.totals div{flex:1}
.totals .n{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.totals .l{font-size:10.5px;color:var(--sub);margin-top:1px}
.meal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.meal-head .l{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.meal-head .l .i{font-size:14px}
.meal-head .r{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.meal-head .add{color:var(--green);font-size:12.5px}
.ditem{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #F6F1E8}
.ditem .n{flex:1;font-size:13.5px}
.ditem .n span{color:var(--sub);font-size:11.5px;margin-left:4px}
.ditem .k{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.ditem .del{color:#9C9184;font-size:15px;padding-left:4px}

/* 我的 */
.profile{display:flex;align-items:center;gap:14px}
.avatar{
  width:56px;height:56px;border-radius:18px;background:var(--green-soft);
  display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;
}
.profile h2{margin:0;font-size:17px;font-weight:600}
.profile p{margin:2px 0 0;font-size:12px;color:var(--sub)}
.group-title{font-size:12px;color:var(--sub);margin:18px 4px 8px;letter-spacing:.5px}
.card.list{padding:2px 16px}

/* 弹层 */
.sheet-mask{
  position:fixed;inset:0;background:rgba(40,33,26,.35);display:none;
  z-index:40;align-items:flex-end;justify-content:center;
}
.sheet-mask.on{display:flex}
.sheet{
  width:100%;max-width:430px;background:var(--bg);border-radius:22px 22px 0 0;
  padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
  animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet .handle{width:36px;height:4px;border-radius:2px;background:#DED4C6;margin:6px auto 14px}
.sheet h3{margin:0 0 4px;font-size:17px;font-weight:600}
.sheet .s-sub{font-size:12px;color:var(--sub);margin:0 0 16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;height:44px;border-radius:12px;border:1px solid var(--line);
  background:#fff;padding:0 13px;outline:none;font-size:15px;
}
.field textarea{height:auto;padding:11px 13px;resize:none}
.field input:focus,.field select:focus{border-color:var(--green)}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.sheet-actions .btn{flex:1}
.link-danger{color:var(--red);font-size:13px;padding:10px 0;text-align:center;display:block}

/* 底部导航 */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;background:rgba(255,255,255,.96);
  border-top:1px solid var(--line);display:flex;padding:7px 0 calc(7px + env(safe-area-inset-bottom));
  backdrop-filter:saturate(180%) blur(12px);z-index:30;
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:#746C61;font-size:10.5px;
}
.tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6}
.tabbar button.on{color:var(--green)}
.tabbar button.on svg{stroke-width:1.9}

/* toast */
.toast{
  position:fixed;left:50%;bottom:120px;transform:translate(-50%,10px);
  background:rgba(42,38,33,.9);color:#fff;font-size:13px;padding:9px 16px;
  border-radius:20px;opacity:0;pointer-events:none;transition:.22s;z-index:60;white-space:nowrap;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 添加到主屏幕提示条（仅 iOS Safari 非全屏时出现一次） */
.tipbar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(74px + env(safe-area-inset-bottom));
  width:calc(100% - 24px);max-width:406px;
  background:rgba(42,38,33,.94);color:#fff;border-radius:14px;
  padding:11px 12px 11px 14px;display:flex;align-items:center;gap:10px;
  font-size:12.5px;line-height:1.5;z-index:55;
  box-shadow:0 8px 24px rgba(42,38,33,.22);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.tipbar[hidden]{display:none}
.tipbar .tip-txt{flex:1;min-width:0}
.tipbar b{font-weight:600;color:#A9D6B8}
.tipbar .tip-x{
  flex:none;width:26px;height:26px;border-radius:50%;border:none;
  background:rgba(255,255,255,.14);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;line-height:1;padding:0;
}

.hint{font-size:11.5px;color:var(--sub);line-height:1.6}
.divider{height:1px;background:var(--line);margin:14px 0}
.pill-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.pill-row .p{font-size:14px}
.pill-row .v{font-size:13px;color:var(--sub)}
.num-inline{color:var(--sub);font-size:12px}
.about p{font-size:13px;color:#5C5348;line-height:1.75;margin:0 0 10px}
.about h3{font-size:14px;margin:16px 0 6px}
/* 周汇总 */
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.week-nav .mid{flex:1;text-align:center}
.week-nav .mid b{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.week-nav .mid span{font-size:11.5px;color:var(--sub)}
.week-nav .nav{width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--sub);font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
.week-nav .nav:disabled{opacity:.35}
.bars{display:flex;align-items:flex-end;gap:6px;padding:18px 0 2px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bars .v{font-size:9.5px;color:var(--sub);margin-bottom:5px;font-variant-numeric:tabular-nums}
.bars .bar{width:100%;max-width:24px;border-radius:5px 5px 3px 3px;background:#A8C9B4;min-height:3px}
.bars .bar.today{background:var(--green)}
.bars .bar.none{background:#EDE5D8}
.bars .d{font-size:10px;color:var(--sub);margin-top:7px}
.bars .wk{font-size:9.5px;color:#A79A88;margin-top:1px}
.share{display:flex;height:8px;border-radius:5px;overflow:hidden;margin:12px 0 8px;background:#F1EAE0}
.share i{display:block;height:100%}
.share-p{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--sub)}
.share-p b{color:var(--ink);font-weight:500}

/* 最常吃的三样 */
.topfood{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.topfood:last-child{border-bottom:none;padding-bottom:2px}
.topfood .rank{width:26px;height:26px;border-radius:9px;background:var(--green-soft);color:var(--green);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;font-variant-numeric:tabular-nums}
.topfood .rank.first{background:var(--green);color:#fff}
.tf-main{flex:1;min-width:0}
.tf-name{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tf-sub{font-size:11.5px;color:var(--sub);margin-top:2px}
.tf-track{height:5px;border-radius:4px;background:#F1EAE0;margin-top:7px;overflow:hidden}
.tf-track i{display:block;height:100%;background:#5C9A78;border-radius:4px}

</style>
</head>
<body>
<div class="app" id="app">
  <main id="view"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div class="sheet-mask" id="sheetMask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="tipbar" id="installTip" hidden>
  <span class="tip-txt">装到桌面更好用：Safari 里点 <b>分享</b> → <b>添加到主屏幕</b>，全屏打开、离线也能记。</span>
  <button class="tip-x" id="installTipClose" type="button" aria-label="关闭提示">×</button>
</div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>
<script>
/* 示例食品数据：名称为常见食物/通用品类，营养值为示例参考，非真实商品数据 */
window.FOOD = [

<script>

/* ---------------- 工具 ---------------- */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function fmtDate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

function parseDate(s) { var a = s.split("-"); return new Date(+a[0], +a[1] - 1, +a[2]); }
function addDays(s, n) { var d = parseDate(s); d.setDate(d.getDate() + n); return fmtDate(d); }
function md(s) { var a = s.split("-"); return +a[1] + "/" + +a[2]; }
function weekday(s) { return "周" + "日一二三四五六".charAt(parseDate(s).getDay()); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function round(v, d) { var p = Math.pow(10, d || 0); return Math.round(v * p) / p; }
function toast(msg) {

/* ---------------- 数据计算 ---------------- */
function sortedWeights() {
  return db.weights.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
}
function currentW() { var w = sortedWeights(); return w.length ? w[w.length - 1] : null; }
function prevW() { var w = sortedWeights(); return w.length > 1 ? w[w.length - 2] : null; }
function firstW() { var w = sortedWeights(); return w.length ? w[0] : null; }
function latest7Avg() {
  var w = sortedWeights().slice(-7);
  if (!w.length) return null;
  return round(w.reduce(function (s, x) { return s + x.value; }, 0) / w.length, 1);
}
function baseGrams(food) {
  var m = /(\d+(?:\.\d+)?)\s*g/.exec(food.basis || "");
  return m ? parseFloat(m[1]) : 100;
}
function scaled(food, grams) {
  var r = grams / baseGrams(food);
  return {
    kcal: Math.round(food.kcal * r),
    p: round(food.p * r, 1),
    f: round(food.f * r, 1),
    c: round(food.c * r, 1)
  };
}
function prefSet() {
  var p = db.profile.prefs || {}; var s = [];
  ["staple", "taste", "meat"].forEach(function (k) { s = s.concat(p[k] || []); });
  return s;
}
function prefScore(food) {
  var set = prefSet();
  return (food.tags || []).filter(function (t) { return set.indexOf(t) >= 0; }).length;
}
function dayItems(date) { return db.diary[date] || {}; }
function mealList(date, meal) { var d = db.diary[date] || {}; return d[meal] || []; }
function dayTotals(date) {
  var t = { kcal: 0, p: 0, f: 0, c: 0 };
  MEALS.forEach(function (m) {
    mealList(date, m.k).forEach(function (it) {
      t.kcal += it.kcal || 0; t.p += it.p || 0; t.f += it.f || 0; t.c += it.c || 0;
    });
  });
  t.p = round(t.p, 1); t.f = round(t.f, 1); t.c = round(t.c, 1);
  return t;
}
function ensureDiary(date, meal) {
  if (!db.diary[date]) db.diary[date] = {};
  if (!db.diary[date][meal]) db.diary[date][meal] = [];
  return db.diary[date][meal];
}

/* ---------------- 状态 ---------------- */
var state = {

/* ---------------- 首页 ---------------- */
function pageHome() {
  var ws = sortedWeights();
  var cur = currentW(), prev = prevW(), first = firstW();
  var bigNum = cur ? cur.value.toFixed(1) : "—";
  var dateLine = cur ? "最近记录 " + cur.date.replace(/-/g, ".") + "（" + weekday(cur.date) + "）" : "还没有记录，从今天开始";
  var dPrev = cur && prev ? round(cur.value - prev.value, 1) : null;
  var dAll = cur && first && ws.length > 1 ? round(cur.value - first.value, 1) : null;

  function deltaTxt(v) {
    if (v === null || v === undefined) return "—";
    if (v === 0) return "持平";
    return (v > 0 ? "+" : "") + v.toFixed(1);
  }
  function deltaCls(v) {
    if (v === null || v === undefined || v === 0) return "flat";
    return v < 0 ? "down" : "up";
  }

  var target = db.profile.target;
  var targetCard = "";
  if (target && cur) {
    var remain = round(cur.value - target, 1);

    targetCard =
      '<section class="card">' +

        '<div class="progress-note"><span>已完成 ' + pct + '%</span><span>' + (remain > 0 ? "还差一点点" : "保持住就好") + '</span></div>' +
      '</section>';
  } else {
    targetCard =
      '<section class="card">' +
        '<div class="target-row"><div><div class="big" style="font-size:17px">设置目标体重</div>' +
        '<div class="sub" style="margin-top:4px">有目标更容易坚持，也可以随时修改</div></div></div>' +
        '<button class="btn ghost small" data-act="edittarget" style="width:100%;height:40px">去设置</button>' +
      '</section>';
  }

  return '<div class="page">' +
    '<div class="hdr"><div><h1>体重记录</h1><p class="sub">' + (cur ? "每天同一时间称重，趋势更准" : "记录第一次体重，之后交给曲线") + '</p></div>' +
    '<div class="date">' + md(todayStr()).replace("/", "月") + "日 " + weekday(todayStr()) + '</div></div>' +

    '<section class="card hero">' +
      '<div class="eyebrow">当前体重</div>' +
      '<div class="big-weight"><span class="num' + (cur ? "" : " placeholder") + '">' + (cur ? bigNum : "未记录") + '</span>' +
      (cur ? '<span class="unit">斤</span>' : "") + '</div>' +
      '<div class="record-date">' + dateLine + '</div>' +
      '<button class="btn" data-act="addweight">＋ 记录体重</button>' +
    '</section>' +

    '<div class="stats">' +
      '<div class="stat"><div class="k">上次记录</div><div class="v">' + (prev ? prev.value.toFixed(1) : "—") + '<small>斤</small></div></div>' +

    '</div>' +

    '<section class="card">' +
      '<div class="card-title"><h2>体重趋势</h2><span class="sub">' + (latest7Avg() !== null ? "7 日均值 " + latest7Avg().toFixed(1) + " 斤" : "单位：斤") + '</span></div>' +
      '<div class="seg">' +
        [[7, "近 7 天"], [30, "近 30 天"], [90, "近 90 天"], ["all", "全部"]].map(function (r) {
          return '<button data-act="range" data-r="' + r[0] + '" class="' + (String(state.range) === String(r[0]) ? "on" : "") + '">' + r[1] + '</button>';
        }).join("") +
      '</div>' +
      '<div class="chart-wrap" id="chartWrap"></div>' +
      '<div class="legend"><span><i class="l1"></i>体重</span><span><i class="l2"></i>7 次平均</span><span style="margin-left:auto">点一下圆点可修改</span></div>' +
    '</section>' +

    targetCard +
  '</div>';
}

function chartArr() {
  var all = sortedWeights();
  if (state.range === "all") return all;
  var cut = new Date(); cut.setDate(cut.getDate() - (state.range - 1));
  var cs = fmtDate(cut);
  return all.filter(function (x) { return x.date >= cs; });
}

function drawChart() {
  var wrap = document.getElementById("chartWrap");
  if (!wrap) return;
  var arr = chartArr();
  if (!arr.length) {
    wrap.innerHTML = '<div class="empty"><span class="e">📈</span>这个时间范围还没有记录<br>换一个范围，或先记一次体重</div>';
    return;
  }
  var W = 330, H = 168, pl = 38, pr = 12, pt = 16, pb = 26;
  var vals = arr.map(function (x) { return x.value; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (max - min < 1.2) { min -= 0.8; max += 0.8; }
  var padV = (max - min) * 0.2; min -= padV; max += padV;
  var n = arr.length;
  function xAt(i) { return n === 1 ? pl + (W - pl - pr) / 2 : pl + i * (W - pl - pr) / (n - 1); }
  function yAt(v) { return pt + (max - v) / (max - min) * (H - pt - pb); }

  var pts = arr.map(function (d, i) { return [xAt(i), yAt(d.value)]; });
  var line = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
  var area = "M" + pts[0][0].toFixed(1) + "," + (H - pb) + " " + pts.map(function (p) { return "L" + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ") + " L" + pts[pts.length - 1][0].toFixed(1) + "," + (H - pb) + " Z";

  // 7 次移动平均
  var avgPts = [];
  for (var i = 0; i < n; i++) {
    var from = Math.max(0, i - 6);
    var seg = vals.slice(from, i + 1);
    var a = seg.reduce(function (s, v) { return s + v; }, 0) / seg.length;
    avgPts.push([xAt(i), yAt(a)]);
  }
  var avgLine = avgPts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");

  // 网格 + y 轴
  var grid = "";
  [max, (max + min) / 2, min].forEach(function (v) {
    var y = yAt(v);
    grid += '<line x1="' + pl + '" y1="' + y.toFixed(1) + '" x2="' + (W - pr) + '" y2="' + y.toFixed(1) + '" stroke="#F1EAE0" stroke-width="1"/>' +
      '<text x="' + (pl - 7) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">' + v.toFixed(1) + '</text>';
  });

  // x 轴标签
  var xl = "";
  [0, n - 1].forEach(function (i, k) {
    if (n === 1 && k === 1) return;
    xl += '<text x="' + xAt(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + (k === 0 ? "start" : "end") + '">' + md(arr[i].date) + '</text>';
  });
  if (n >= 4) {
    var mi = Math.floor((n - 1) / 2);
    xl += '<text x="' + xAt(mi).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + md(arr[mi].date) + '</text>';
  }

  var dots = arr.map(function (d, i) {
    var p = pts[i];
    return '<circle class="dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4.5" data-act="editw" data-id="' + d.id + '"/>';
  }).join("");

  // 最新值气泡
  var last = pts[pts.length - 1];
  var lx = Math.min(W - pr - 4, Math.max(pl + 12, last[0]));
  var bubble = '<g><rect x="' + (lx - 22) + '" y="' + Math.max(2, last[1] - 26) + '" width="44" height="19" rx="9" fill="#48825F"/>' +
    '<text x="' + lx + '" y="' + (Math.max(2, last[1] - 26) + 13) + '" text-anchor="middle" fill="#fff" style="font-size:10px;fill:#fff">' + arr[arr.length - 1].value.toFixed(1) + '</text></g>';

  wrap.innerHTML =
    '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto">' +
      grid +
      '<path d="' + area + '" fill="#5C9A78" opacity="0.10"/>' +
      '<path d="' + avgLine + '" class="avg"/>' +
      '<path d="' + line + '" fill="none" stroke="#5C9A78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
      dots + bubble + xl +

}

function filteredFoods() {

  if (state.foodFilter === "fav") list = list.filter(function (f) { return db.favorites.indexOf(f.id) >= 0; });
  if (state.foodFilter === "pref") list = list.filter(function (f) { return prefScore(f) > 0; });
  var q = state.foodSearch.trim().toLowerCase();
  if (q) list = list.filter(function (f) {
    return (f.name + f.cat + (f.tags || []).join("") + f.reason).toLowerCase().indexOf(q) >= 0;

    list.sort(function (a, b) {
      var d = prefScore(b) - prefScore(a);

function intakeHint(t) {
  var est = energyEstimate();
  if (!est) return '<p class="hint" style="margin:10px 0 0;text-align:center">补充身高、年龄和体重后，可看到每日摄入的参考区间</p>';
  var low = est.low, high = est.high;
  var msg;
  if (t.kcal === 0) msg = "参考区间 " + low + "–" + high + " kcal，记录后会自动对比";
  else if (t.kcal < low * 0.7) msg = "今天摄入明显偏低，长期过低容易掉肌肉、代谢变慢";
  else if (t.kcal < low) msg = "比参考区间略低，注意蛋白质吃够";
  else if (t.kcal <= high) msg = "落在大致合理的区间内，继续保持";
  else msg = "超出参考区间较多，明天回到平常量就好，不必补偿性节食";
  return '<p class="hint" style="margin:10px 0 0;text-align:center">' + msg + '</p>';
}

function energyEstimate() {
  var h = db.profile.height, a = db.profile.age, w = currentW();
  if (!h || !a || !w) return null;
  var kg = w.value / 2;
  var act = (ACTIVITY[db.profile.activity] || ACTIVITY.light)[1];
  var bmr = 10 * kg + 6.25 * h - 5 * a - 78;
  var tdee = bmr * act;
  var low = Math.max(Math.round(bmr * 1.1), Math.round(tdee * 0.8));
  var high = Math.round(tdee * 0.95);
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), low: low, high: high };
}

      '<div class="field"><label>热量（kcal）</label><input id="eiKcal" type="number" inputmode="decimal" value="' + it.kcal + '"></div>' +
    '</div>' +
    '<div class="sheet-actions"><button class="btn ghost" data-act="closesheet">取消</button>' +

    '<button class="link-danger" data-act="delitem" data-meal="' + meal + '" data-i="' + i + '">删除这条记录</button>'
  );
}

function saveItem(meal, i) {
  var items = mealList(state.date, meal);
  var it = items[i]; if (!it) return;
  var gEl = document.getElementById("eiGrams"), kEl = document.getElementById("eiKcal");
  var newG = parseFloat(gEl.value);
  var newK = parseFloat(kEl.value);
  if (isNaN(newK) || newK < 0) { toast("热量填写有误"); return; }
  var oldG = it.grams, oldK = it.kcal;
  if (newG && !isNaN(newG)) it.grams = newG;
  it.kcal = Math.round(newK);
  // 按比例调整营养
  if (oldK > 0 && Math.abs(newK - oldK) > 0.5) {
    var r = newK / oldK;
    it.p = round(it.p * r, 1); it.f = round(it.f * r, 1); it.c = round(it.c * r, 1);
  } else if (newG && oldG && Math.abs(newG - oldG) > 0.5 && oldK > 0) {
    var r2 = newG / oldG;
    it.kcal = Math.round(oldK * r2);
    it.p = round(it.p * r2, 1); it.f = round(it.f * r2, 1); it.c = round(it.c * r2, 1);
  }
  save(); closeSheet(); toast("已修改"); render();
}

/* ---------------- 周汇总 ---------------- */
function mondayOf(dateStr) {
  var d = parseDate(dateStr);
  var wd = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - wd);
  return fmtDate(d);
}
function weekOf(anchor) {
  var start = mondayOf(anchor || todayStr());
  var days = [];
  for (var i = 0; i < 7; i++) days.push(addDays(start, i));
  return { start: start, end: days[6], days: days };
}
function weekTotals(days) {
  var t = { kcal: 0, p: 0, f: 0, c: 0, records: 0, activeDays: 0 };
  days.forEach(function (d) {
    var x = dayTotals(d);
    t.kcal += x.kcal; t.p += x.p; t.f += x.f; t.c += x.c;
    var n = MEALS.reduce(function (s, m) { return s + mealList(d, m.k).length; }, 0);
    t.records += n;
    if (n > 0) t.activeDays++;
  });
  t.p = round(t.p, 1); t.f = round(t.f, 1); t.c = round(t.c, 1);
  return t;
}
function weekLabel(start, end) {
  var a = start.split("-"), b = end.split("-");
  if (a[0] !== b[0]) return (+a[0]) + "年" + (+a[1]) + "月" + (+a[2]) + "日 – " + (+b[0]) + "年" + (+b[1]) + "月" + (+b[2]) + "日";
  if (a[1] === b[1]) return (+a[1]) + "月" + (+a[2]) + "日 – " + (+b[2]) + "日";
  return (+a[1]) + "月" + (+a[2]) + "日 – " + (+b[1]) + "月" + (+b[2]) + "日";
}

function pageWeek() {
  var cur = weekOf(state.weekAnchor || todayStr());
  var isCurrent = cur.start === mondayOf(todayStr());
  var t = weekTotals(cur.days);
  var prevT = weekTotals(weekOf(addDays(cur.start, -7)).days);
  var avg = Math.round(t.kcal / 7);
  var prevAvg = Math.round(prevT.kcal / 7);
  var diff = avg - prevAvg;
  var diffPct = prevAvg > 0 ? Math.round(diff / prevAvg * 100) : 0;
  var maxK = 1;
  cur.days.forEach(function (d) { maxK = Math.max(maxK, dayTotals(d).kcal); });

  var freq = {};
  cur.days.forEach(function (d) {
    MEALS.forEach(function (m) {
      mealList(d, m.k).forEach(function (it) {
        var name = (it.name || "").trim();
        if (!name) return;
        if (!freq[name]) freq[name] = { name: name, n: 0, kcal: 0 };
        freq[name].n += 1;
        freq[name].kcal += it.kcal || 0;
      });
    });
  });
  var top = Object.keys(freq).map(function (k) { return freq[k]; })
    .sort(function (a, b) { return b.n - a.n || b.kcal - a.kcal || (a.name < b.name ? -1 : 1); })
    .slice(0, 3);

  var eP = t.p * 4, eF = t.f * 9, eC = t.c * 4, eAll = eP + eF + eC;
  function pct(v) { return eAll > 0 ? Math.round(v / eAll * 100) : 0; }

  var cmpHtml;
  if (prevT.kcal === 0) {
    cmpHtml = '<span class="v">上周还没有记录</span>';
  } else {
    var cls = diff === 0 ? "flat" : diff < 0 ? "down" : "up";
    cmpHtml = '<span class="v ' + cls + '" style="font-weight:600">' +
      (diff > 0 ? "+" : "") + diff + ' kcal' + (diffPct !== 0 ? "（" + (diff > 0 ? "+" : "") + diffPct + "%）" : "") + '</span>';
  }

  var bars = cur.days.map(function (d, i) {
    var k = dayTotals(d).kcal;
    var h = k > 0 ? Math.max(4, Math.round(k / maxK * 74)) : 3;
    var isToday = d === todayStr();
    return '<div class="col">' +
      '<div class="v">' + (k > 0 ? k : "") + '</div>' +
      '<div class="bar' + (isToday ? " today" : "") + (k > 0 ? "" : " none") + '" style="height:' + (k > 0 ? h : 3) + 'px"></div>' +
      '<div class="d">' + (+d.split("-")[2]) + '</div>' +
      '<div class="wk">' + "一二三四五六日".charAt(i) + '</div>' +
    '</div>';
  }).join("");

  var dayRows = cur.days.map(function (d, i) {
    var x = dayTotals(d);
    var n = MEALS.reduce(function (s, m) { return s + mealList(d, m.k).length; }, 0);
    var wk = "周" + "一二三四五六日".charAt(i);
    var detail = n > 0 ? wk + " · 蛋白 " + x.p + " · 脂肪 " + x.f + " · 碳水 " + x.c : wk + " · 没有记录";
    return '<div class="row" data-act="weekday" data-date="' + d + '">' +
      '<div class="ico" style="background:#F6F1E8;color:#6F675C;font-size:11px">' + md(d) + '</div>' +
      '<div class="main"><div class="t"' + (n ? "" : ' style="color:var(--sub)"') + '>' + (n ? x.kcal + " kcal" : "未记录") + '</div>' +
      '<div class="d">' + detail + '</div></div>' +
      '<div class="val">' + (n ? n + " 条" : "—") + '</div>' +
      '<div class="arrow">›</div></div>';
  }).join("");

  var health;
  if (t.kcal === 0) {
    health = "这一周还没有饮食记录。先记两三天，汇总就有意义了。";
  } else if (t.activeDays <= 2) {
    health = "这一周只记了 " + t.activeDays + " 天，日均容易被单日拉偏；记满 5 天以上再看趋势更可靠。";
  } else {
    var est = energyEstimate();
    if (!est) {
      health = "补充身高、年龄和体重后，这里会给出与你自己匹配的每日参考区间；暂时以「和自己上周比」为准。";
    } else {
      var msg;
      if (avg < est.low * 0.85) msg = "日均比参考区间偏低较多，长期吃太少容易掉肌肉、代谢变慢，可以适当加一点主食和蛋白质。";
      else if (avg > est.high * 1.1) msg = "日均比参考区间偏高一些，下周回到平常量就好，不需要补偿性节食。";
      else msg = "日均落在大致合理的区间内，保持这个节奏就行。";
      health = "按你的身高体重估算，每日参考区间 " + est.low + "–" + est.high + " kcal（7 天约 " +
        est.low * 7 + "–" + est.high * 7 + " kcal），这一周日均 " + avg + " kcal。" + msg +
        "区间只是参考，不是必须达成的目标。";
    }
  }

  return '<div class="page">' +
    '<button class="back" data-act="goto" data-page="diary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>饮食记录</button>' +
    '<div class="hdr" style="padding-top:2px"><div><h1>周汇总</h1><p class="sub">按周一至周日统计，共记录 ' + t.activeDays + ' 天</p></div>' +
    (isCurrent ? '<span class="chip" style="margin-top:8px">本周</span>' : '<button class="chip" data-act="weeknow" style="margin-top:8px">回到本周</button>') +
    '</div>' +

    '<div class="week-nav">' +
      '<button class="nav" data-act="weekprev">‹</button>' +
      '<div class="mid"><b>' + weekLabel(cur.start, cur.end) + '</b><span>' + cur.start.replace(/-/g, ".") + ' – ' + cur.end.replace(/-/g, ".") + '</span></div>' +
      '<button class="nav" data-act="weeknext"' + (isCurrent ? " disabled" : "") + '>›</button>' +
    '</div>' +

    '<section class="card">' +
      '<div class="card-title"><h2>合计</h2><span class="sub">' + t.records + ' 条记录</span></div>' +
      '<div style="display:flex;align-items:baseline;gap:6px">' +
        '<span style="font-size:34px;font-weight:600;letter-spacing:-1px">' + t.kcal + '</span>' +
        '<span style="font-size:13px;color:var(--sub)">kcal</span>' +
        '<span style="margin-left:auto;font-size:12.5px;color:var(--sub)">日均 ' + avg + ' kcal</span>' +
      '</div>' +
      (eAll > 0
        ? '<div class="share"><i style="width:' + pct(eP) + '%;background:#5C9A78"></i><i style="width:' + pct(eF) + '%;background:#D9A55F"></i><i style="width:' + pct(eC) + '%;background:#C9B79B"></i></div>' +
          '<div class="share-p"><span>蛋白 <b>' + t.p + ' g</b> ' + pct(eP) + '%</span><span>脂肪 <b>' + t.f + ' g</b> ' + pct(eF) + '%</span><span>碳水 <b>' + t.c + ' g</b> ' + pct(eC) + '%</span></div>'
        : '<p class="hint" style="margin:10px 0 0">这一周没有记录，营养素比例暂时无法计算</p>') +
      '<div class="divider"></div>' +
      '<div class="pill-row" style="padding:0"><span class="p" style="font-size:13px">与上周日均</span>' + cmpHtml + '</div>' +
    '</section>' +

    '<section class="card">' +
      '<div class="card-title"><h2>每天热量</h2><span class="sub">点下面某一天可查看明细</span></div>' +
      '<div class="bars">' + bars + '</div>' +
    '</section>' +

    '<section class="card">' +
      '<div class="card-title"><h2>最常吃的三样</h2><span class="sub">' + (isCurrent ? "本周" : "这一周") + '</span></div>' +
      (top.length
        ? top.map(function (f, i) {
            var share = t.kcal > 0 ? Math.round(f.kcal / t.kcal * 100) : 0;
            return '<div class="topfood">' +
              '<span class="rank' + (i === 0 ? " first" : "") + '">' + (i + 1) + '</span>' +
              '<div class="tf-main">' +
                '<div class="tf-name">' + esc(f.name) + '</div>' +
                '<div class="tf-sub">吃了 ' + f.n + ' 次 · 共 ' + f.kcal + ' kcal · 占' + (isCurrent ? "本周" : "这一周") + ' ' + share + '%</div>' +
                '<div class="tf-track"><i style="width:' + Math.max(4, share) + '%"></i></div>' +
              '</div>' +
            '</div>';
          }).join("")
        : '<p class="hint" style="margin:0">这一周还没有记录，记两天就能看出反复吃的是哪几样</p>') +
    '</section>' +

    '<section class="card list">' + dayRows + '</section>' +

    '<div class="card tight"><p class="hint" style="margin:0">' + health + '</p></div>' +
  '</div>';
}

      '<p>内置食物均为<strong>示例数据</strong>，名称取常见食物或通用品类，营养值按包装标注（label）、可靠来源（source）、估算（estimate）三类标注，价格与渠道仅作示意。如需精确数据，请以商品包装为准，或用手动输入记录。</p>' +
      '<h3>健康提示</h3>' +
      '<p>体重受水分、盐分、生理周期影响，单日波动不代表失败，请以 7 日均值和长期趋势为准。每日摄入参考区间按基础代谢估算，不建议长期低于基础代谢；如有疾病、孕期或特殊饮食需求，请遵医嘱。</p>' +
      '<h3>隐私</h3>' +
      '<p>应用不申请位置、通讯录、相机权限，也不含第三方统计代码。</p>' +
      '<div class="divider"></div>' +
      '<p style="font-size:12px;color:var(--sub);margin:0">本地优先 · 无账号 · 可离线</p>' +
    '</div>' +
  '</div>';
}

/* ---------------- 弹层 ---------------- */
function openSheet(html) {
  var sheet = document.getElementById("sheet");
  var mask = document.getElementById("sheetMask");
  sheet.innerHTML = '<div class="handle"></div>' + html;
  mask.classList.add("on");
}
function closeSheet() {
  document.getElementById("sheetMask").classList.remove("on");
  document.getElementById("sheet").innerHTML = "";
}

function openWeightForm(id) {
  var w = id ? db.weights.filter(function (x) { return x.id === id; })[0] : null;
  var cur = currentW();
  openSheet(
    '<h3>' + (w ? "修改体重" : "记录体重") + '</h3>' +
    '<p class="s-sub">建议固定在同一时间、同一状态下称重</p>' +
    '<div class="field"><label>日期</label><input type="date" id="wDate" value="' + (w ? w.date : todayStr()) + '" max="' + todayStr() + '"></div>' +
    '<div class="field"><label>体重（斤）</label><input type="number" id="wValue" inputmode="decimal" step="0.1" placeholder="例如 108.6" value="' + (w ? w.value : (cur ? cur.value : "")) + '"></div>' +
    '<div class="sheet-actions"><button class="btn ghost" data-act="closesheet">取消</button>' +
    '<button class="btn" data-act="saveweight" data-id="' + (w ? w.id : "") + '">保存</button></div>' +
    (w ? '<button class="link-danger" data-act="delweight" data-id="' + w.id + '">删除这条记录</button>' : '')
  );
}

function saveWeight(id) {
  var d = document.getElementById("wDate").value;
  var v = parseFloat(document.getElementById("wValue").value);
  if (!d) { toast("请选择日期"); return; }
  if (!v || v < 30 || v > 400) { toast("请输入合理体重（斤）"); return; }
  v = round(v, 1);
  if (id) {
    var rec = db.weights.filter(function (x) { return x.id === id; })[0];
    if (rec) {
      var other = db.weights.filter(function (x) { return x !== rec && x.date === d; })[0];
      if (other) { toast("该日期已有记录，请先删除另一条"); return; }
      rec.date = d; rec.value = v;
    }
  } else {
    var exist = db.weights.filter(function (x) { return x.date === d; })[0];
    if (exist) { exist.value = v; toast("已更新该日期的记录"); }
    else { db.weights.push({ id: uid(), date: d, value: v }); toast("已记录"); }
  }
  save(); closeSheet(); render();
}

function deleteWeight(id) {
  db.weights = db.weights.filter(function (x) { return x.id !== id; });
  save(); closeSheet(); toast("已删除"); render();
}

function openBodyForm() {
  var p = db.profile;
  openSheet(
    '<h3>身体数据</h3><p class="s-sub">只用于估算参考摄入量，不影响记录</p>' +
    '<div class="field-row">' +
      '<div class="field"><label>身高（cm）</label><input id="pH" type="number" inputmode="decimal" value="' + (p.height || "") + '" placeholder="165"></div>' +
      '<div class="field"><label>年龄</label><input id="pA" type="number" inputmode="numeric" value="' + (p.age || "") + '" placeholder="25"></div>' +
    '</div>' +
    '<div class="field"><label>日常活动量</label><select id="pAct">' +
      Object.keys(ACTIVITY).map(function (k) {
        return '<option value="' + k + '"' + (p.activity === k ? " selected" : "") + '>' + ACTIVITY[k][0] + '</option>';
      }).join("") + '</select></div>' +
    '<div class="sheet-actions"><button class="btn ghost" data-act="closesheet">取消</button>' +
    '<button class="btn" data-act="savebody">保存</button></div>'
  );
}

function saveBody() {
  var h = parseFloat(document.getElementById("pH").value);
  var a = parseFloat(document.getElementById("pA").value);
  if (h && (h < 120 || h > 220)) { toast("身高填写有误"); return; }
  if (a && (a < 10 || a > 100)) { toast("年龄填写有误"); return; }
  db.profile.height = h || null;
  db.profile.age = a || null;
  db.profile.activity = document.getElementById("pAct").value;
  save(); closeSheet(); toast("已保存"); render();
}

function openTargetForm() {
  openSheet(
    '<h3>目标体重</h3><p class="s-sub">建议先设一个 3–8 斤的小目标，达成再往下走</p>' +
    '<div class="field"><label>目标体重（斤）</label><input id="tVal" type="number" inputmode="decimal" step="0.1" value="' + (db.profile.target || "") + '" placeholder="例如 100"></div>' +
    '<div class="sheet-actions"><button class="btn ghost" data-act="closesheet">取消</button>' +
    '<button class="btn" data-act="savetarget">保存</button></div>' +
    (db.profile.target ? '<button class="link-danger" data-act="cleartarget">清除目标</button>' : '')
  );
}

function saveTarget() {
  var v = parseFloat(document.getElementById("tVal").value);
  if (!v || v < 50 || v > 400) { toast("请输入合理目标（斤）"); return; }
  db.profile.target = round(v, 1);
  save(); closeSheet(); toast("目标已设置"); render();
}

function openLinkForm(id) {
  var cur = db.links[id] || "";
  openSheet(
    '<h3>商品购买链接</h3><p class="s-sub">粘贴商品页地址，只保存在本机，不会上传</p>' +
    '<div class="field"><label>链接</label><input id="linkUrl" inputmode="url" placeholder="https://" value="' + esc(cur) + '"></div>' +
    '<div class="sheet-actions"><button class="btn ghost" data-act="closesheet">取消</button>' +
    '<button class="btn" data-act="savelink" data-id="' + id + '">保存</button></div>' +
    (cur ? '<button class="link-danger" data-act="dellink" data-id="' + id + '">移除链接</button>' : '') +
    '<p class="hint" style="text-align:center;margin:10px 0 0">示例数据没有真实商品页，链接请自行填写</p>'
  );
}

function saveLink(id) {
  var v = (document.getElementById("linkUrl").value || "").trim();
  if (!/^https?:\/\//i.test(v)) { toast("请填写以 http(s):// 开头的链接"); return; }
  db.links[id] = v;
  save(); closeSheet(); toast("链接已保存");
}

/* ---------------- 备份 / 导出 / 恢复 ---------------- */
function download(name, content, type) {
  var blob = new Blob([content], { type: type });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}

function backup() {
  var payload = { app: "轻卡日记", version: 2, exportedAt: new Date().toISOString(), data: db };
  download("轻卡日记-备份-" + todayStr().replace(/-/g, "") + ".json", JSON.stringify(payload, null, 2), "application/json");
  toast("备份文件已生成");
}

function exportCSV() {
  var dates = {};
  db.weights.forEach(function (w) { dates[w.date] = true; });
  Object.keys(db.diary).forEach(function (d) { dates[d] = true; });
  var rows = [["日期", "体重(斤)", "摄入(kcal)", "蛋白质(g)", "脂肪(g)", "碳水(g)", "记录条目"]];
  Object.keys(dates).sort().forEach(function (d) {
    var w = db.weights.filter(function (x) { return x.date === d; })[0];
    var t = dayTotals(d);
    var cnt = MEALS.reduce(function (s, m) { return s + mealList(d, m.k).length; }, 0);
    rows.push([d, w ? w.value.toFixed(1) : "", t.kcal || "", t.p || "", t.f || "", t.c || "", cnt || ""]);
  });
  var csv = "\ufeff" + rows.map(function (r) {
    return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(",");
  }).join("\r\n");
  download("轻卡日记-导出-" + todayStr().replace(/-/g, "") + ".csv", csv, "text/csv;charset=utf-8");
  toast("CSV 已导出");
}

function restoreFile(file) {
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var obj = JSON.parse(reader.result);
      var data = obj && obj.data ? obj.data : obj;
      if (!data || !Array.isArray(data.weights)) throw new Error("bad");
      if (!confirm("导入将覆盖当前全部数据，确定继续？")) return;
      db = {
        v: 2,
        profile: Object.assign(defaultDB().profile, data.profile || {},
          { prefs: Object.assign(defaultDB().profile.prefs, (data.profile || {}).prefs || {}) }),
        weights: data.weights || [],
        diary: data.diary || {},
        favorites: data.favorites || [],
        links: data.links || {}
      };
      save(); render(); toast("数据已恢复");
    } catch (e) {
      toast("文件无法识别，请选择本应用导出的备份");
    }
  };
  reader.readAsText(file);
}

/* ---------------- 交互 ---------------- */
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.dataset.act;
  var id = el.dataset.id;

  switch (act) {
    case "tab":
      state.page = el.dataset.tab;
      if (state.page === "diary") state.date = state.date || todayStr();
      closeSheet(); render(); break;
    case "goto":
      state.page = el.dataset.page; closeSheet(); render(); break;
    case "addweight":
      closeSheet(); openWeightForm(null); break;
    case "editw":
      e.stopPropagation(); openWeightForm(id); break;
    case "delweight":
      e.stopPropagation();
      if (confirm("删除这条体重记录？")) deleteWeight(id);
      break;
    case "saveweight":
      saveWeight(id || null); break;
    case "range":
      state.range = el.dataset.r === "all" ? "all" : parseInt(el.dataset.r, 10);
      render(); break;
    case "edittarget":
      openTargetForm(); break;
    case "savetarget":
      saveTarget(); break;
    case "cleartarget":
      db.profile.target = null; save(); closeSheet(); toast("已清除目标"); render(); break;
    case "editbody":
      openBodyForm(); break;
    case "savebody":
      saveBody(); break;
    case "foodsec":
      state.foodSec = el.dataset.sec; state.foodCat = "全部"; state.foodSearch = "";
      state.foodFilter = "all"; state.page = "foodList"; render(); break;
    case "cat":
      state.foodCat = el.dataset.cat; render(); break;
    case "filter":
      state.foodFilter = el.dataset.f; render(); break;
    case "fooddetail":
      openFoodDetail(id); break;
    case "fav":
      e.stopPropagation();
      toggleFav(id); break;
    case "portion":
      openPortion(id); break;
    case "setmeal":
      state.pendingMeal = el.dataset.meal;
      if (document.getElementById("mealSeg")) {
        Array.prototype.forEach.call(document.querySelectorAll("#mealSeg button"), function (b) {
          b.classList.toggle("on", b.dataset.meal === state.pendingMeal);
        });
      }
      state.pickMeal = state.pendingMeal;
      Array.prototype.forEach.call(document.querySelectorAll(".sheet .seg button[data-act=setmeal]"), function (b) {
        b.classList.toggle("on", b.dataset.meal === state.pickMeal);
      });
      break;
    case "confirmportion":
      confirmPortion(); break;
    case "addfood":
      e.stopPropagation(); openAddFood(el.dataset.meal); break;
    case "pickfood":
      state.pendingMeal = state.pickMeal; openPortion(id); break;
    case "pickfav":
      openPickFav(el.dataset.meal); break;
    case "addcustom":
      closeSheet(); openCustom(el.dataset.meal); break;
    case "savecustom":
      saveCustom(); break;
    case "edititem":
      openEditItem(el.dataset.meal, parseInt(el.dataset.i, 10)); break;
    case "delitem":
      e.stopPropagation();
      if (confirm("删除这条饮食记录？")) {
        var arr = ensureDiary(state.date, el.dataset.meal);
        arr.splice(parseInt(el.dataset.i, 10), 1);
        save(); closeSheet(); toast("已删除"); render();
      }
      break;
    case "saveitem":
      saveItem(el.dataset.meal, parseInt(el.dataset.i, 10)); break;
    case "dayprev":
      state.date = addDays(state.date, -1); render(); break;
    case "daynext":
      state.date = addDays(state.date, 1); render(); break;
    case "calendarpick":
      openDatePicker(); break;
    case "week":
      state.weekAnchor = state.weekAnchor || todayStr();
      state.page = "week"; render(); break;
    case "weekprev":
      state.weekAnchor = addDays(weekOf(state.weekAnchor).start, -7); render(); break;
    case "weeknext":
      if (weekOf(state.weekAnchor).start !== mondayOf(todayStr())) {
        state.weekAnchor = addDays(weekOf(state.weekAnchor).start, 7); render();
      }
      break;
    case "weeknow":
      state.weekAnchor = todayStr(); render(); break;
    case "weekday":
      state.date = el.dataset.date; state.page = "diary"; render(); break;
    case "pref":
      togglePref(el.dataset.g, el.dataset.o); break;
    case "saveprefs":
      savePrefsText(); break;
    case "prefs":
      state.page = "prefs"; render(); break;
    case "history":
      state.page = "history"; render(); break;
    case "about":
      state.page = "about"; render(); break;
    case "diary":
      state.page = "diary"; render(); break;
    case "favs":
      state.page = "favs"; render(); break;
    case "setlink":
      openLinkForm(id); break;
    case "savelink":
      saveLink(id); break;
    case "dellink":
      delete db.links[id]; save(); closeSheet(); toast("已移除链接"); render(); break;
    case "backup":
      backup(); break;
    case "exportcsv":
      exportCSV(); break;
    case "restore":
      document.getElementById("fileInput").click(); break;
    case "closesheet":
      closeSheet(); break;
  }
});

document.addEventListener("input", function (e) {
  if (e.target.id === "foodSearch") {
    state.foodSearch = e.target.value;
    var body = document.getElementById("foodListBody");
    if (body) body.innerHTML = foodListBody();
  }
  if (e.target.id === "pickSearch") {
    state.pickSearch = e.target.value;
    var pl = document.getElementById("pickList");
    if (pl) pl.innerHTML = pickListHtml();
  }
  if (e.target.id === "gramsInput") updatePortionPreview();
});

document.addEventListener("change", function (e) {
  if (e.target.id === "fileInput") {
    var f = e.target.files && e.target.files[0];
    if (f) restoreFile(f);
    e.target.value = "";
  }
  if (e.target.id === "diaryDateInput") {
    state.date = e.target.value || todayStr(); render();
  }
});

function toggleFav(id) {
  var i = db.favorites.indexOf(id);
  if (i >= 0) { db.favorites.splice(i, 1); toast("已取消收藏"); }
  else {
    db.favorites.push(id);
    var f = FOOD.filter(function (x) { return x.id === id; })[0];
    toast("已收藏" + (f ? f.name : ""));
  }
  save();
  if (document.getElementById("sheetMask").classList.contains("on")) openFoodDetail(id);
  render();
}

function togglePref(g, o) {
  var arr = db.profile.prefs[g] || (db.profile.prefs[g] = []);
  var i = arr.indexOf(o);
  if (i >= 0) arr.splice(i, 1); else arr.push(o);
  save();
  render();
}

function savePrefsText() {
  db.profile.dislikes = document.getElementById("prefDislike").value.trim();
  db.profile.allergies = document.getElementById("prefAllergy").value.trim();
  var b = parseFloat(document.getElementById("prefBudget").value);
  db.profile.budget = b > 0 ? b : null;
  save(); toast("偏好已保存"); render();
}

function openPickFav(meal) {
  var favs = FOOD.filter(function (f) { return db.favorites.indexOf(f.id) >= 0; });
  if (!favs.length) { toast("还没有收藏的食物"); return; }
  openSheet(
    '<h3>收藏的食物</h3><p class="s-sub">点一下直接加入' + MEALS.filter(function (m) { return m.k === meal; })[0].n + '</p>' +
    favs.map(function (f) {
      return '<div class="food" data-act="pickfood" data-id="' + f.id + '">' +
        '<div class="thumb" style="width:46px;height:46px;font-size:20px">' + f.emoji + '</div>' +
        '<div class="info"><div class="name">' + esc(f.name) + '</div><div class="meta">' + esc(f.basis) + '</div></div>' +
        '<div class="right"><div class="kcal">' + f.kcal + '<small>kcal</small></div></div></div>';
    }).join("") +
    '<button class="btn ghost" data-act="closesheet" style="margin-top:8px">关闭</button>'
  );
  state.pickMeal = meal;
}

function openDatePicker() {
  openSheet(
    '<h3>按日期查看</h3><p class="s-sub">可以查看、补记或修改过去的饮食</p>' +
    '<div class="field"><label>选择日期</label><input type="date" id="jumpDate" max="' + todayStr() + '" value="' + state.date + '"></div>' +
    '<div class="sheet-actions"><button class="btn ghost" data-act="closesheet">取消</button>' +
    '<button class="btn" data-act="jumpdate">查看</button></div>'
  );
}
document.addEventListener("click", function (e) {
  var el = e.target.closest('[data-act="jumpdate"]');
  if (!el) return;
  var v = document.getElementById("jumpDate").value;
  if (v) { state.date = v; closeSheet(); render(); }
});

document.getElementById("sheetMask").addEventListener("click", function (e) {
  if (e.target === this) closeSheet();
});

/* ---------------- 启动 ---------------- */
window.App = {
  saveWeight: function (ev) { if (ev) ev.preventDefault(); },
  closeSheet: closeSheet
};

document.getElementById("tabbar").innerHTML = TABS.map(function (t) {
  return '<button data-act="tab" data-tab="' + t.p + '">' + (ICON[t.i] || ICON.home) + '<span>' + t.n + '</span></button>';
}).join("");

render();
})();
</script>
<script>
/* ---------------- PWA：全屏判定 / 离线缓存 / 安装提示 / 持久化存储 ---------------- */
(function () {
  var root = document.documentElement;

  function isStandalone() {
    var d = window.matchMedia ? window.matchMedia("(display-mode: standalone)").matches : false;
    var f = window.matchMedia ? window.matchMedia("(display-mode: fullscreen)").matches : false;
    return d || f || window.navigator.standalone === true;
  }
  function syncMode() {
    if (isStandalone()) root.classList.add("standalone");
    else root.classList.remove("standalone");
  }
  syncMode();
  if (window.matchMedia) {
    try {
      var mq = window.matchMedia("(display-mode: standalone)");
      if (mq.addEventListener) mq.addEventListener("change", syncMode);
      else if (mq.addListener) mq.addListener(syncMode);
    } catch (e) {}
  }

  /* Service Worker 需在安全上下文（https 或 localhost）才能注册成功 */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function (err) {
        console.warn("[轻卡日记] 离线缓存未启用（需 HTTPS 或 localhost）：", err && err.message);
      });
    });
  }

  /* 申请持久化存储，降低系统回收本地数据的概率；不支持时静默跳过 */
  try {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persisted().then(function (ok) {
        if (!ok) navigator.storage.persist();
      }).catch(function () {});
    }
  } catch (e) {}

  /* iOS Safari 且非独立窗口时，提示一次“添加到主屏幕” */
  (function () {
    var KEY = "lean.install.tip";
    var bar = document.getElementById("installTip");
    if (!bar) return;
    try { if (localStorage.getItem(KEY) === "off") return; } catch (e) { return; }
    var ua = navigator.userAgent || "";
    var isIOS = /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
    if (!isIOS || !isSafari || isStandalone()) return;
    bar.hidden = false;
    var close = document.getElementById("installTipClose");
    if (close) {
      close.addEventListener("click", function () {
        bar.hidden = true;
        try { localStorage.setItem(KEY, "off"); } catch (e) {}
      });
    }
  })();
})();
</script>
